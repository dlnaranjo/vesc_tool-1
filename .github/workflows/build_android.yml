name: Build Android APK

on:
  push:
    branches:
      - ci/android-build
  workflow_dispatch:

jobs:
  build-mobile-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Qt 5.15.2 Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'linux'
          target: 'android'
          arch: 'android'
          cache: true

      - name: Install Android SDK components
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "${SDK_ROOT}" ]; then
            SDK_ROOT="/opt/android-sdk"
          fi

          if [ -x "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "${SDK_ROOT}/cmdline-tools/bin/sdkmanager" ]; then
            SDKMANAGER="${SDK_ROOT}/cmdline-tools/bin/sdkmanager"
          else
            echo "sdkmanager not found under ${SDK_ROOT}" >&2
            find "${SDK_ROOT}" -maxdepth 4 -type f -name sdkmanager || true
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"

          yes | "${SDKMANAGER}" --licenses || true
          "${SDKMANAGER}" \
            "platforms;android-33" \
            "build-tools;33.0.0" \
            "ndk;23.2.8568313"
          echo "ANDROID_NDK_ROOT=${SDK_ROOT}/ndk/23.2.8568313" >> "$GITHUB_ENV"

      - name: Show tool versions
        run: |
          set -euxo pipefail
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          echo "ANDROID_NDK_ROOT=${ANDROID_NDK_ROOT}"
          java -version
          ~/Qt/5.15.2/android/bin/qmake -v
          if [ -x "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --version
          else
            "${ANDROID_SDK_ROOT}/cmdline-tools/bin/sdkmanager" --version
          fi

      - name: Build mobile APK
        run: |
          set -euxo pipefail
          ~/Qt/5.15.2/android/bin/qmake -config release "CONFIG+=release_android CONFIG+=build_mobile" ANDROID_ABIS="arm64-v8a" -spec android-clang
          make clean
          make -j"$(nproc)"
          make install INSTALL_ROOT=build/android/build
          ~/Qt/5.15.2/android/bin/androiddeployqt \
            --gradle \
            --no-gdbserver \
            --output build/android/build \
            --input android-vesc_tool-deployment-settings.json \
            --android-platform android-33
          mkdir -p output
          cp build/android/build/build/outputs/apk/debug/build-debug.apk output/vesc_tool_mobile.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vesc_tool_mobile_apk
          path: output/vesc_tool_mobile.apk
          if-no-files-found: error
