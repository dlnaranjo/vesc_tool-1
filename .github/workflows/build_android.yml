name: Build Android APK

on:
  push:
    branches:
      - ci/android-build
  workflow_dispatch:

jobs:
  build-mobile-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip curl

      - name: Setup Java 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Qt 5.15.2 Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'linux'
          target: 'android'
          arch: 'android'
          cache: true

      - name: Install Android SDK components
        run: |
          set -euxo pipefail
          SDK_ROOT="${RUNNER_TEMP}/android-sdk"
          mkdir -p "${SDK_ROOT}/cmdline-tools"
          curl -fsSL -o "${RUNNER_TEMP}/cmdline-tools.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "${RUNNER_TEMP}/cmdline-tools.zip" -d "${SDK_ROOT}"
          mkdir -p "${SDK_ROOT}/cmdline-tools/latest"
          mv "${SDK_ROOT}/cmdline-tools/bin" "${SDK_ROOT}/cmdline-tools/latest/"
          mv "${SDK_ROOT}/cmdline-tools/lib" "${SDK_ROOT}/cmdline-tools/latest/"
          mv "${SDK_ROOT}/cmdline-tools/NOTICE.txt" "${SDK_ROOT}/cmdline-tools/latest/" || true
          mv "${SDK_ROOT}/cmdline-tools/source.properties" "${SDK_ROOT}/cmdline-tools/latest/"

          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"

          yes | "${SDKMANAGER}" --licenses || true
          "${SDKMANAGER}" \
            "platforms;android-33" \
            "build-tools;33.0.0" \
            "ndk;23.2.8568313"
          echo "ANDROID_NDK_ROOT=${SDK_ROOT}/ndk/23.2.8568313" >> "$GITHUB_ENV"

      - name: Setup Java 8 (for Android build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Resolve Qt bin path
        run: |
          set -euxo pipefail
          QMAKE_PATH="$(find "$HOME" -type f -path '*/Qt/5.15.2/*/bin/qmake' | head -n 1 || true)"
          if [ -z "$QMAKE_PATH" ]; then
            echo "Could not locate qmake under $HOME/Qt" >&2
            find "$HOME" -maxdepth 5 -type d -name Qt || true
            exit 1
          fi
          QT_BIN_DIR="$(dirname "$QMAKE_PATH")"
          echo "QT_BIN_DIR=${QT_BIN_DIR}" >> "$GITHUB_ENV"
          echo "Resolved QT_BIN_DIR=${QT_BIN_DIR}"

      - name: Show tool versions (non-blocking)
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          echo "ANDROID_NDK_ROOT=${ANDROID_NDK_ROOT}"
          echo "QT_BIN_DIR=${QT_BIN_DIR}"
          java -version || true
          "${QT_BIN_DIR}/qmake" -v || true
          "${QT_BIN_DIR}/androiddeployqt" -h >/dev/null 2>&1 || true
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --version || true

      - name: Build mobile APK
        run: |
          set -euxo pipefail
          "${QT_BIN_DIR}/qmake" -config release "CONFIG+=release_android CONFIG+=build_mobile" ANDROID_ABIS="arm64-v8a" -spec android-clang
          make clean
          make -j"$(nproc)"
          make install INSTALL_ROOT=build/android/build
          "${QT_BIN_DIR}/androiddeployqt" \
            --gradle \
            --no-gdbserver \
            --output build/android/build \
            --input android-vesc_tool-deployment-settings.json \
            --android-platform android-33
          mkdir -p output
          cp build/android/build/build/outputs/apk/debug/build-debug.apk output/vesc_tool_mobile.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vesc_tool_mobile_apk
          path: output/vesc_tool_mobile.apk
          if-no-files-found: error
