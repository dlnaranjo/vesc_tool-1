name: Build Android APK

on:
  push:
    branches:
      - ci/android-build
  workflow_dispatch:

jobs:
  build-mobile-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Qt 5.15.2 Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'linux'
          target: 'android'
          arch: 'android'
          cache: true

      - name: Install Android SDK components
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euxo pipefail
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-33" \
            "build-tools;33.0.0" \
            "ndk;23.2.8568313"

      - name: Show tool versions
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/23.2.8568313
        run: |
          set -euxo pipefail
          java -version
          ~/Qt/5.15.2/android/bin/qmake -v
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --version

      - name: Build mobile APK
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/23.2.8568313
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          set -euxo pipefail
          ~/Qt/5.15.2/android/bin/qmake -config release "CONFIG+=release_android CONFIG+=build_mobile" ANDROID_ABIS="arm64-v8a" -spec android-clang
          make clean
          make -j"$(nproc)"
          make install INSTALL_ROOT=build/android/build
          ~/Qt/5.15.2/android/bin/androiddeployqt \
            --gradle \
            --no-gdbserver \
            --output build/android/build \
            --input android-vesc_tool-deployment-settings.json \
            --android-platform android-33
          mkdir -p output
          cp build/android/build/build/outputs/apk/debug/build-debug.apk output/vesc_tool_mobile.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vesc_tool_mobile_apk
          path: output/vesc_tool_mobile.apk
          if-no-files-found: error
